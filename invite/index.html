<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lovio Invite</title>
    <meta name="description" content="Open your Lovio partner invite.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#FBF6F3">
    <meta property="og:title" content="Lovio Invite">
    <meta property="og:description" content="Open your Lovio partner invite.">
    <meta property="og:image" content="https://getlovio.app/assets/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="/assets/icon.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <div class="site-header wrap">
        <header class="nav">
            <a href="/" class="brand" aria-label="Lovio home"><img src="/assets/logo.png" alt=""><span>lovio</span></a>
            <a href="/support.html" class="nav-cta" style="background:none;box-shadow:none;color:var(--ink-2);font-weight:500">Need help?</a>
        </header>
    </div>

    <main class="center-page">
        <section class="center-main" aria-labelledby="invite-title">
            <div class="pair-art" aria-hidden="true">
                <span class="slot slot--filled"><img src="/assets/icon.png" alt=""></span>
                <span class="link"><img src="/assets/img/heart.png" alt=""></span>
                <span class="slot slot--empty"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#621F3D" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg></span>
            </div>
            <p class="eyebrow">Partner invite</p>
            <h1 id="invite-title">Join me <em>on</em> <span class="grad-text">Lovio.</span></h1>
            <p class="lead">Open this invite in the Lovio app to pair up — or download it first, then enter the code.</p>

            <div class="code-panel">
                <p class="code-panel-label" id="invite-code-label">Your invite code</p>
                <div class="invite-code" id="invite-code" role="text" aria-labelledby="invite-code-label"><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span><span>-</span></div>
                <div class="code-actions">
                    <a id="open-app-link" class="btn btn--primary" href="#">Open in Lovio</a>
                    <button id="copy-code-button" class="btn btn--outline" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2" /><path d="M5 15V5a2 2 0 0 1 2-2h10" /></svg>Copy code</button>
                </div>
                <p id="copy-status" class="status" aria-live="polite"></p>
            </div>

            <p class="divider">Don't have Lovio yet?</p>
            <div class="store-row">
                <a class="btn-store" href="/go/ios" target="_blank" rel="noopener noreferrer" aria-label="Download on the App Store"><svg width="20" height="24" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z" /></svg><span><small>Download on the</small><b>App Store</b></span></a>
                <a class="btn-store btn-store--light" href="/go/android" target="_blank" rel="noopener noreferrer" aria-label="Get it on Google Play"><svg width="20" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="#00D7FF" d="M3.7 2.4C3.26 2.85 3 3.55 3 4.46v15.08c0 .91.26 1.61.7 2.06l.1.1L12.25 12v-.18L3.8 2.3l-.1.1Z" /><path fill="#00F076" d="m15.05 14.8-2.8-2.8v-.18l2.8-2.8.06.04 3.32 1.89c.95.54.95 1.38 0 1.92l-3.32 1.89-.06.04Z" /><path fill="#FFCF00" d="m15.11 14.76-2.86-2.85-8.55 9.69c.48.51 1.24.57 2.1.08l9.31-5.3Z" /><path fill="#FF3A44" d="m15.11 8.98-9.31-5.3c-.86-.49-1.62-.43-2.1.08l8.55 9.69 2.86-2.85Z" /></svg><span><small>Get it on</small><b>Google Play</b></span></a>
            </div>
        </section>
    </main>

    <script src="/site.js"></script>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var rawCode = params.get('code') || window.location.pathname.split('/').filter(Boolean).pop() || '';
            var code = rawCode.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
            var customSchemeUrl = code ? 'datemate-ai-v2://invite/' + encodeURIComponent(code) : 'datemate-ai-v2://invite';
            var codeBox = document.getElementById('invite-code');
            var status = document.getElementById('copy-status');

            if (code) {
                codeBox.innerHTML = '';
                code.split('').forEach(function (char) {
                    var cell = document.createElement('span');
                    cell.textContent = char;
                    codeBox.appendChild(cell);
                });
                codeBox.setAttribute('aria-label', 'Invite code ' + code.split('').join(' '));
            }

            document.getElementById('open-app-link').href = customSchemeUrl;

            document.getElementById('copy-code-button').addEventListener('click', function () {
                if (!code) {
                    status.textContent = 'No invite code found in this link.';
                    return;
                }

                navigator.clipboard.writeText(code).then(function () {
                    status.textContent = 'Invite code copied.';
                }).catch(function () {
                    status.textContent = 'Code: ' + code;
                });
            });
        })();
    </script>
</body>

</html>
