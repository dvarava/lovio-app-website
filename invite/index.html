<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lovio Invite</title>
    <meta name="description" content="Open your Lovio partner invite.">
    <link rel="icon" type="image/png" href="../assets/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <div class="container invite-container">
        <header>
            <a href="/" class="logo" aria-label="Lovio home">
                <img src="../assets/logo.png" alt="Lovio Logo" class="logo-img">
                lovio
            </a>
            <nav class="links">
                <a href="/support.html">Support</a>
            </nav>
        </header>

        <main class="invite-page">
            <section class="invite-panel" aria-labelledby="invite-title">
                <p class="invite-kicker">Partner invite</p>
                <h1 id="invite-title">Join me on Lovio</h1>
                <p class="invite-copy">Open this invite in the Lovio app to pair with your partner.</p>

                <div class="invite-code-block">
                    <span class="invite-code-label">Invite code</span>
                    <strong id="invite-code">------</strong>
                </div>

                <div class="invite-actions">
                    <a id="open-app-link" class="btn-primary" href="#">Open Lovio</a>
                    <button id="copy-code-button" class="btn-secondary" type="button">Copy code</button>
                </div>

                <p id="copy-status" class="invite-status" aria-live="polite"></p>

                <div class="download-cta-group invite-store-buttons">
                    <a href="https://apps.apple.com/app/id6743631737" class="app-store-btn" target="_blank"
                        rel="noopener noreferrer" aria-label="Download on the App Store">
                        <svg viewBox="0 0 384 512" fill="currentColor" class="store-logo apple-logo"
                            aria-hidden="true">
                            <path
                                d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z" />
                        </svg>
                        <div class="btn-text">
                            <span class="btn-subtitle">Download on the</span>
                            <span class="btn-title">App Store</span>
                        </div>
                    </a>
                    <a href="https://play.google.com/store/apps/details?id=com.fourplex.lovio"
                        class="google-play-btn" aria-label="Get it on Google Play">
                        <img src="../assets/google-play-icon.png" alt="" class="store-logo google-play-logo"
                            aria-hidden="true">
                        <div class="btn-text">
                            <span class="btn-subtitle">Get it on</span>
                            <span class="btn-title">Google Play</span>
                        </div>
                    </a>
                </div>
            </section>
        </main>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var rawCode = params.get('code') || window.location.pathname.split('/').filter(Boolean).pop() || '';
            var code = rawCode.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
            var codeText = code || '------';
            var customSchemeUrl = code ? 'datemate-ai-v2://invite/' + encodeURIComponent(code) : 'datemate-ai-v2://invite';

            document.getElementById('invite-code').textContent = codeText;
            document.getElementById('open-app-link').href = customSchemeUrl;

            document.getElementById('copy-code-button').addEventListener('click', function () {
                if (!code) {
                    return;
                }

                navigator.clipboard.writeText(code).then(function () {
                    document.getElementById('copy-status').textContent = 'Invite code copied.';
                }).catch(function () {
                    document.getElementById('copy-status').textContent = 'Code: ' + code;
                });
            });
        })();
    </script>
</body>

</html>
