<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../assets/icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Download Lovio</title>
    <meta name="description" content="Download Lovio for iOS or Android.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700;900&amp;display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <div class="container download-container">
        <header>
            <a href="../index.html" class="logo">
                <img src="../assets/logo.png" alt="Lovio Logo" class="logo-img">
                lovio
            </a>
            <nav class="links">
                <a href="../support.html">Support</a>
                <a href="../feedback.html">Feedback</a>
            </nav>
        </header>

        <main class="download-page">
            <section class="download-card glass-panel" aria-labelledby="download-title">
                <img src="../assets/logo.png" alt="Lovio" class="download-logo">
                <p class="download-eyebrow">Lovio for couples</p>
                <h1 id="download-title">Download Lovio</h1>
                <p class="download-description">Keep the spark alive with date ideas, daily questions, and shared
                    moments.</p>

                <div class="download-cta-group" aria-label="Choose your app store">
                    <a href="/go/ios" class="app-store-btn store-button" data-store-link
                        aria-label="Download Lovio on the App Store">
                        <svg viewBox="0 0 384 512" fill="currentColor" class="apple-logo" aria-hidden="true">
                            <path
                                d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z" />
                        </svg>
                        <div class="btn-text">
                            <span class="btn-subtitle">Download on the</span>
                            <span class="btn-title">App Store</span>
                        </div>
                    </a>
                    <a href="/go/android" class="google-play-btn store-button" data-store-link
                        aria-label="Get Lovio on Google Play">
                        <svg viewBox="0 0 24 24" class="google-play-logo" aria-hidden="true">
                            <path fill="#00D7FF" d="M3.7 2.4C3.26 2.85 3 3.55 3 4.46v15.08c0 .91.26 1.61.7 2.06l.1.1L12.25 12v-.18L3.8 2.3l-.1.1Z" />
                            <path fill="#00F076" d="m15.05 14.8-2.8-2.8v-.18l2.8-2.8.06.04 3.32 1.89c.95.54.95 1.38 0 1.92l-3.32 1.89-.06.04Z" />
                            <path fill="#FFCF00" d="m15.11 14.76-2.86-2.85-8.55 9.69c.48.51 1.24.57 2.1.08l9.31-5.3Z" />
                            <path fill="#FF3A44" d="m15.11 8.98-9.31-5.3c-.86-.49-1.62-.43-2.1.08l8.55 9.69 2.86-2.85Z" />
                        </svg>
                        <span class="btn-text">
                            <span class="btn-subtitle">Get it on</span>
                            <span class="btn-title">Google Play</span>
                        </span>
                    </a>
                </div>

                <p class="download-note">Choose your store above to continue.</p>
            </section>
        </main>
    </div>

    <script>
        (() => {
            const trackingKeys = ["utm_source", "utm_medium", "utm_campaign", "utm_content", "fbclid"];
            const incomingParams = new URLSearchParams(document.location.search);

            document.querySelectorAll("[data-store-link]").forEach((link) => {
                const destination = new URL(link.href);

                trackingKeys.forEach((key) => {
                    const value = incomingParams.get(key);
                    if (value !== null) {
                        destination.searchParams.set(key, value);
                    }
                });

                link.href = destination.toString();
            });
        })();
    </script>
</body>

</html>
